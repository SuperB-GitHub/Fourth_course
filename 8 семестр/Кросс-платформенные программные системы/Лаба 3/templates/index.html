<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Распознавание геометрических фигур | Лабораторная работа №2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-size: 16px;
        }

        .upload-hint {
            color: #999;
            font-size: 12px;
            margin-top: 10px;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .preview-container.show {
            display: block;
        }

        .preview-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .predict-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 20px;
        }

        .predict-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .predict-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-container {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 20px;
            display: none;
        }

        .result-container.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .prediction {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        .prediction.circle { background: #ffeaa7; color: #d63031; }
        .prediction.triangle { background: #b2bec3; color: #0984e3; }
        .prediction.square { background: #dfe6e9; color: #00b894; }

        .confidence {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .probabilities {
            margin-top: 20px;
        }

        .prob-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px;
            background: white;
            border-radius: 8px;
        }

        .prob-label {
            font-weight: bold;
            width: 100px;
        }

        .prob-bar-container {
            flex: 1;
            height: 25px;
            background: #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            margin: 0 10px;
        }

        .prob-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 12px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .prob-value {
            min-width: 50px;
            text-align: right;
            font-weight: bold;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Распознавание фигур</h1>
        <div class="subtitle">Круг • Треугольник • Квадрат</div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Нажмите или перетащите изображение</div>
            <div class="upload-hint">Поддерживаются JPG, PNG (до 16MB)</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="preview-container" id="previewContainer">
            <img id="previewImage" class="preview-image" alt="Предпросмотр">
            <div id="filename" style="font-size: 12px; color: #999;"></div>
        </div>

        <button class="predict-btn" id="predictBtn" disabled>🔮 Распознать фигуру</button>

        <div class="result-container" id="resultContainer">
            <div class="result-title">🎯 Результат распознавания</div>
            <div class="prediction" id="prediction"></div>
            <div class="confidence" id="confidence"></div>
            <div class="probabilities" id="probabilities"></div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <footer>Лабораторная работа №2 | Нейронная сеть</footer>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const filenameSpan = document.getElementById('filename');
        const predictBtn = document.getElementById('predictBtn');
        const resultContainer = document.getElementById('resultContainer');
        const errorMessage = document.getElementById('errorMessage');
        
        let currentFile = null;

        // Клик по области загрузки
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            } else {
                showError('Пожалуйста, загрузите изображение');
            }
        });

        // Выбор файла
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Пожалуйста, загрузите изображение');
                return;
            }
            
            if (file.size > 16 * 1024 * 1024) {
                showError('Файл слишком большой (макс. 16MB)');
                return;
            }

            currentFile = file;
            
            // Показываем предпросмотр
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewContainer.classList.add('show');
                filenameSpan.textContent = file.name;
            };
            reader.readAsDataURL(file);
            
            // Скрываем ошибку и результат
            errorMessage.classList.remove('show');
            resultContainer.classList.remove('show');
            
            // Активируем кнопку
            predictBtn.disabled = false;
        }

        predictBtn.addEventListener('click', async () => {
            if (!currentFile) return;
            
            // Показываем загрузку
            predictBtn.disabled = true;
            const originalText = predictBtn.innerHTML;
            predictBtn.innerHTML = 'Распознавание <span class="loading"></span>';
            
            // Отправляем на сервер
            const formData = new FormData();
            formData.append('image', currentFile);
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResult(data);
                } else {
                    showError(data.error || 'Ошибка при распознавании');
                }
            } catch (error) {
                showError('Ошибка соединения с сервером');
                console.error(error);
            } finally {
                predictBtn.disabled = false;
                predictBtn.innerHTML = originalText;
            }
        });
        
        function displayResult(data) {
            const predictionDiv = document.getElementById('prediction');
            const confidenceDiv = document.getElementById('confidence');
            const probabilitiesDiv = document.getElementById('probabilities');
            
            // Определяем класс для стиля
            let shapeClass = '';
            switch(data.prediction) {
                case 'Круг': shapeClass = 'circle'; break;
                case 'Треугольник': shapeClass = 'triangle'; break;
                case 'Квадрат': shapeClass = 'square'; break;
            }
            
            predictionDiv.className = `prediction ${shapeClass}`;
            predictionDiv.innerHTML = getShapeIcon(data.prediction) + ' ' + data.prediction;
            confidenceDiv.innerHTML = `Уверенность: ${data.confidence}%`;
            
            // Отображаем вероятности для всех классов
            let probsHtml = '<div style="margin-top: 15px;"><strong>Вероятности:</strong></div>';
            for (const [shape, prob] of Object.entries(data.probabilities)) {
                const roundedProb = prob.toFixed(2);
                probsHtml += `
                    <div class="prob-item">
                        <span class="prob-label">${getShapeIcon(shape)} ${shape}</span>
                        <div class="prob-bar-container">
                            <div class="prob-bar" style="width: ${roundedProb}%">${roundedProb}%</div>
                        </div>
                    </div>
                `;
            }
            probabilitiesDiv.innerHTML = probsHtml;
            
            resultContainer.classList.add('show');
            errorMessage.classList.remove('show');
        }
        
        function getShapeIcon(shape) {
            switch(shape) {
                case 'Круг': return '⚪';
                case 'Треугольник': return '🔺';
                case 'Квадрат': return '⬛';
                default: return '❓';
            }
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            resultContainer.classList.remove('show');
        }
    </script>
</body>
</html>
