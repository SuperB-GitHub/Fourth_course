<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История распознаваний | Лабораторная работа №2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            padding: 36px 32px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            transition: all 0.2s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 20px;
        }

        h1 {
            color: #1e293b;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .subtitle {
            color: #5b6e8c;
            font-size: 14px;
            font-weight: 450;
            margin-top: 4px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            color: #1e293b;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            border: 1px solid #e2e8f0;
        }

        .back-btn:hover {
            background: #e2e8f0;
            transform: translateY(-1px);
        }

        .stats-bar {
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px 24px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid #eef2f6;
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stat-label {
            color: #5b6e8c;
            font-size: 13px;
            font-weight: 500;
        }

        .stat-value {
            color: #1e293b;
            font-size: 24px;
            font-weight: 700;
        }

        .refresh-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #334155;
        }

        .refresh-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #eef2f8;
            background: #ffffff;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .history-table th {
            text-align: left;
            padding: 16px 20px;
            background: #f8fafc;
            color: #334155;
            font-weight: 600;
            border-bottom: 1px solid #e9edf2;
        }

        .history-table td {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f2f5;
            color: #1e293b;
        }

        .history-table tr:hover td {
            background: #fafcff;
        }

        .history-table tr:last-child td {
            border-bottom: none;
        }

        .shape-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
        }

        .shape-badge.circle { background: #fff7e6; color: #b45309; }
        .shape-badge.triangle { background: #f1f5f9; color: #1e40af; }
        .shape-badge.square { background: #ecfdf5; color: #065f46; }

        .confidence-bar-container {
            width: 120px;
            height: 28px;
            background: #eef2f8;
            border-radius: 40px;
            overflow: hidden;
        }

        .confidence-bar {
            height: 100%;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 10px;
            font-weight: 600;
            color: white;
            background: linear-gradient(90deg, #334155, #1e293b);
        }

        .image-preview {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 12px;
            background: #f1f5f9;
            cursor: pointer;
            transition: transform 0.2s ease;
            border: 1px solid #e2e8f0;
        }

        .image-preview:hover {
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal-img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading-row td {
            text-align: center;
            padding: 60px !important;
        }

        .loader {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: #1e293b;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            color: #8ba0bc;
            font-size: 12px;
            font-weight: 450;
            border-top: 1px solid #eef2f8;
            padding-top: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 20px;
            }
            .history-table th,
            .history-table td {
                padding: 10px 12px;
            }
            .stat-value {
                font-size: 18px;
            }
            .confidence-bar-container {
                width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📋 История распознаваний</h1>
                <div class="subtitle">Сохранённые результаты классификации геометрических фигур</div>
            </div>
            <a href="/" class="back-btn">← На главную</a>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-label">Всего записей:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Круг:</span>
                <span class="stat-value" id="circleCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Треугольник:</span>
                <span class="stat-value" id="triangleCount">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Квадрат:</span>
                <span class="stat-value" id="squareCount">0</span>
            </div>
            <button class="refresh-btn" id="refreshBtn">⟳ Обновить</button>
        </div>

        <div class="table-container">
            <table class="history-table" id="historyTable">
                <thead>
                    <tr>
                        <th>Изображение</th>
                        <th>Имя файла</th>
                        <th>Результат</th>
                        <th>Уверенность</th>
                        <th>Время</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="loading-row">
                        <td colspan="5">
                            <div class="loader"></div>
                            <div style="margin-top: 12px; color: #94a3b8;">Загрузка истории...</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="footer">Лабораторная работа №2 | нейросетевая модель</div>
    </div>

    <!-- Модальное окно для просмотра изображения -->
    <div class="modal" id="imageModal">
        <img class="modal-img" id="modalImage" alt="Полноразмерное изображение">
    </div>

    <script>
        (function() {
            const tableBody = document.getElementById('tableBody');
            const totalCountSpan = document.getElementById('totalCount');
            const circleCountSpan = document.getElementById('circleCount');
            const triangleCountSpan = document.getElementById('triangleCount');
            const squareCountSpan = document.getElementById('squareCount');
            const refreshBtn = document.getElementById('refreshBtn');
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');

            let historyData = [];

            // Форматирование даты
            function formatDate(dateString) {
                if (!dateString) return '—';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } catch(e) {
                    return dateString;
                }
            }

            // Получение класса для бейджа
            function getShapeClass(shape) {
                switch(shape) {
                    case 'Круг': return 'circle';
                    case 'Треугольник': return 'triangle';
                    case 'Квадрат': return 'square';
                    default: return '';
                }
            }

            // Получение цвета для полосы уверенности (используем единый стиль)
            function getConfidenceColor(percent) {
                // возвращаем стандартный градиент
                return 'linear-gradient(90deg, #334155, #1e293b)';
            }

            // Обновление статистики
            function updateStats(data) {
                totalCountSpan.textContent = data.length;
                let circle = 0, triangle = 0, square = 0;
                data.forEach(item => {
                    if (item.predicted_class === 'Круг') circle++;
                    else if (item.predicted_class === 'Треугольник') triangle++;
                    else if (item.predicted_class === 'Квадрат') square++;
                });
                circleCountSpan.textContent = circle;
                triangleCountSpan.textContent = triangle;
                squareCountSpan.textContent = square;
            }

            // Рендер таблицы
            function renderTable(data) {
                if (!data || data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <div>История пока пуста</div>
                                <div style="font-size: 12px; margin-top: 8px;">Загрузите изображение на главной странице</div>
                            </td>
                        </tr>
                    `;
                    updateStats([]);
                    return;
                }

                let html = '';
                for (const item of data) {
                    const shapeClass = getShapeClass(item.predicted_class);
                    const confidencePercent = (item.confidence * 100).toFixed(1);
                    const barWidth = Math.min(100, Math.max(0, item.confidence * 100));
                    
                    // Формируем превью изображения (если есть base64)
                    let previewHtml = '';
                    if (item.image_data) {
                        // Если image_data уже есть в ответе (base64)
                        previewHtml = `<img src="data:image/png;base64,${item.image_data}" class="image-preview" data-full="${item.image_data}" alt="предпросмотр">`;
                    } else if (item.image_preview) {
                        previewHtml = `<img src="data:image/png;base64,${item.image_preview}" class="image-preview" data-full="${item.image_preview}" alt="предпросмотр">`;
                    } else {
                        previewHtml = `<div style="width: 48px; height: 48px; background: #f1f5f9; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cbd5e1;">📷</div>`;
                    }
                    
                    html += `
                        <tr>
                            <td><div class="image-cell">${previewHtml}</div></td>
                            <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(item.filename)}">${escapeHtml(item.filename)}</td>
                            <td><span class="shape-badge ${shapeClass}">${item.predicted_class}</span></td>
                            <td>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <div class="confidence-bar-container">
                                        <div class="confidence-bar" style="width: ${barWidth}%; background: ${getConfidenceColor(barWidth)}">${confidencePercent}%</div>
                                    </div>
                                </div>
                            </td>
                            <td style="white-space: nowrap;">${formatDate(item.created_at)}</td>
                        </tr>
                    `;
                }
                tableBody.innerHTML = html;
                updateStats(data);

                // Добавляем обработчики для клика по изображениям
                document.querySelectorAll('.image-preview').forEach(img => {
                    img.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const fullBase64 = img.getAttribute('data-full');
                        if (fullBase64) {
                            modalImage.src = `data:image/png;base64,${fullBase64}`;
                            modal.classList.add('show');
                        } else {
                            // Если нет base64, возможно есть другой атрибут
                            const src = img.src;
                            if (src) {
                                modalImage.src = src;
                                modal.classList.add('show');
                            }
                        }
                    });
                });
            }

            // Простая защита от XSS
            function escapeHtml(str) {
                if (!str) return '';
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            // Загрузка истории с сервера
            async function loadHistory() {
                tableBody.innerHTML = `
                    <tr class="loading-row">
                        <td colspan="5">
                            <div class="loader"></div>
                            <div style="margin-top: 12px; color: #94a3b8;">Загрузка истории...</div>
                        </td>
                    </tr>
                `;
                
                try {
                    const response = await fetch('/history');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    historyData = data;
                    renderTable(data);
                } catch (error) {
                    console.error('Ошибка загрузки истории:', error);
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">
                                <div class="empty-state-icon">⚠️</div>
                                <div>Ошибка загрузки данных</div>
                                <div style="font-size: 12px; margin-top: 8px;">${error.message}</div>
                            </td>
                        </tr>
                    `;
                    updateStats([]);
                }
            }

            // Закрытие модального окна
            modal.addEventListener('click', () => {
                modal.classList.remove('show');
                modalImage.src = '';
            });

            // Обновление по кнопке
            refreshBtn.addEventListener('click', () => {
                loadHistory();
            });

            // Загружаем историю при загрузке страницы
            loadHistory();
        })();
    </script>
</body>
</html>
